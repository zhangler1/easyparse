# 开发环境覆盖配置（docker compose up 自动合并此文件）
#
# 核心设计：
#   - 将宿主机项目目录挂载到容器，实现代码热更新
#   - /app/.venv 用命名卷替代匿名卷
#     命名卷优势：持久化、可管理、跨容器共享
#   - 启用 uvicorn --reload 实现热重载

services:
  easyparse:
    build:
      context: .
      dockerfile: dockerfile.uv
    command:
      - "--reload"          # uvicorn 热重载
      - "--port=5000"
      - "--workers=1"       # 开发环境单 worker
    volumes:
      - .:/app              # 挂载源码，支持热更新
      - venv_data:/app/.venv          # 命名卷：保留容器内的 .venv，不被宿主机的 .venv 覆盖
      - shared_tmp:/tmp/shared_all
    environment:
      - SERVER_WORKERS=1
      - LOG_LEVEL=10        # DEBUG 级别
    ports:
      - "5000:5000"
      - "5678:5678"         # 预留 debugpy 调试端口

volumes:
  venv_data:
  shared_tmp:
